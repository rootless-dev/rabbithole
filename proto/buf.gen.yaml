version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: ../daemon/internal/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../daemon/internal/gen
    opt: paths=source_relative
  - local: protoc-gen-swift
    out: ../app/Sources/Generated
    opt:
      - Visibility=Public
  - local: protoc-gen-grpc-swift-2
    out: ../app/Sources/Generated
    opt:
      - Visibility=Public
      - Server=false
      - Client=true
