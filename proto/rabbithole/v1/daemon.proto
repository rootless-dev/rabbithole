syntax = "proto3";

package rabbithole.v1;

option go_package = "rabbithole/daemon/internal/gen/rabbithole/v1;rabbitholev1";

// Daemon is the upload daemon API consumed by the menu bar app over a Unix socket.
service Daemon {
  // Configure supplies S3 credentials and destination settings.
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
  // EnqueueUpload queues local files and folders as one upload.
  rpc EnqueueUpload(EnqueueUploadRequest) returns (EnqueueUploadResponse);
  // WatchUploads streams a snapshot whenever an upload changes state or progresses.
  rpc WatchUploads(WatchUploadsRequest) returns (stream UploadSnapshot);
  // WatchUploadFiles streams every file of one upload once, then a snapshot
  // whenever one of its files changes state or progresses.
  rpc WatchUploadFiles(WatchUploadFilesRequest) returns (stream FileSnapshot);
  // RetryUpload sends failed files of an upload again, inside the same upload.
  rpc RetryUpload(RetryUploadRequest) returns (RetryUploadResponse);
  // RemoveUpload takes an upload, or some of its files, out of the history,
  // and deletes their objects from the bucket when asked to.
  rpc RemoveUpload(RemoveUploadRequest) returns (RemoveUploadResponse);
  // SetOptions replaces the options that apply to every upload.
  rpc SetOptions(SetOptionsRequest) returns (SetOptionsResponse);
  // PauseUpload stops sending an upload and keeps what was already sent.
  rpc PauseUpload(PauseUploadRequest) returns (PauseUploadResponse);
  // ResumeUpload puts an upload the user paused back in the queue.
  rpc ResumeUpload(ResumeUploadRequest) returns (ResumeUploadResponse);
  // CancelUpload stops an upload for good. Files it already sent stay in the
  // bucket and in the history; the rest become canceled.
  rpc CancelUpload(CancelUploadRequest) returns (CancelUploadResponse);
  // StartDownload copies files of an upload from the bucket to a local folder.
  rpc StartDownload(StartDownloadRequest) returns (StartDownloadResponse);
  // CancelDownload stops a download and removes the file it was writing.
  rpc CancelDownload(CancelDownloadRequest) returns (CancelDownloadResponse);
  // WatchDownloads streams a snapshot whenever a download changes or progresses.
  // Downloads live only as long as the daemon: they are not kept in the history.
  rpc WatchDownloads(WatchDownloadsRequest) returns (stream DownloadSnapshot);
  // ListBuckets lists the buckets the given access key can see. It works
  // before Configure, so the bucket can be chosen while setting the account up.
  rpc ListBuckets(ListBucketsRequest) returns (ListBucketsResponse);
  // CreateBucket creates a private bucket. It works before Configure.
  rpc CreateBucket(CreateBucketRequest) returns (CreateBucketResponse);
}

message SetOptionsRequest {
  // The most bytes per second all uploads together may send. Zero means no limit.
  int64 speed_limit_bytes_per_second = 1;
  // Have S3 check every upload against a checksum computed from the local
  // file, so an upload only finishes when the stored object matches it.
  bool verify_uploads = 2;
  // Hold every upload: nothing is sent until this is false again. The app
  // sets it while the computer runs on battery, when the user asked for that.
  bool hold_uploads = 3;
}

message SetOptionsResponse {}

message PauseUploadRequest {
  string upload_id = 1;
}

message PauseUploadResponse {}

message ResumeUploadRequest {
  string upload_id = 1;
}

message ResumeUploadResponse {}

message CancelUploadRequest {
  string upload_id = 1;
}

message CancelUploadResponse {}

message StartDownloadRequest {
  string upload_id = 1;
  // The files to download, by FileSnapshot.index. Empty means every finished
  // file of the upload.
  repeated int32 file_indexes = 2;
  // The local folder the files are written into. A single file lands directly
  // in it; a folder upload is recreated inside it under the folder's name.
  // Nothing existing is overwritten: a taken name gets a suffix.
  string destination_dir = 3;
}

message StartDownloadResponse {
  string download_id = 1;
}

message CancelDownloadRequest {
  string download_id = 1;
}

message CancelDownloadResponse {}

message WatchDownloadsRequest {}

enum DownloadState {
  DOWNLOAD_STATE_UNSPECIFIED = 0;
  DOWNLOAD_QUEUED = 1;
  DOWNLOADING = 2;
  DOWNLOAD_FINISHED = 3;
  DOWNLOAD_FAILED = 4;
  DOWNLOAD_CANCELED = 5;
}

message DownloadSnapshot {
  string download_id = 1;
  string upload_id = 2;
  // The files being downloaded, by FileSnapshot.index, as resolved at the start.
  repeated int32 file_indexes = 3;
  // What is shown for the download: the file name or the folder name.
  string name = 4;
  // Where the result is: the file for a single file, the folder otherwise.
  string destination_path = 5;
  int64 bytes_total = 6;
  int64 bytes_done = 7;
  int32 files_total = 8;
  int32 files_done = 9;
  int32 files_failed = 10;
  DownloadState state = 11;
  string error_message = 12;
}

message ListBucketsRequest {
  string access_key_id = 1;
  string secret_access_key = 2;
  // The region used to reach S3 for the listing.
  string region = 3;
}

message Bucket {
  string name = 1;
  // The region the bucket lives in; empty when it could not be read.
  string region = 2;
}

message ListBucketsResponse {
  repeated Bucket buckets = 1;
}

message CreateBucketRequest {
  string access_key_id = 1;
  string secret_access_key = 2;
  // The region the bucket is created in.
  string region = 3;
  string name = 4;
}

message CreateBucketResponse {}

message RetryUploadRequest {
  string upload_id = 1;
  // The files to send again, by FileSnapshot.index. Empty means every failed
  // file of the upload. A listed file that did not fail is an error.
  repeated int32 file_indexes = 2;
}

message RetryUploadResponse {}

message RemoveUploadRequest {
  string upload_id = 1;
  // The files to remove, by FileSnapshot.index. Empty means the whole upload.
  repeated int32 file_indexes = 2;
  // Also delete the objects from the bucket. When false only the history
  // forgets them and the objects stay where they are.
  bool delete_from_bucket = 3;
}

message RemoveUploadResponse {}

message ConfigureRequest {
  string access_key_id = 1;
  string secret_access_key = 2;
  string region = 3;
  string bucket = 4;
  string quick_uploads_prefix = 5;
  // Put uploads that a previous exit cut off back in the queue. It acts once,
  // on the first successful Configure after the daemon starts.
  bool resume_interrupted = 6;
}

message ConfigureResponse {}

message EnqueueUploadRequest {
  // A single file or folder. Ignored when local_paths is not empty.
  string local_path = 1;
  // The files and folders that together become one upload.
  repeated string local_paths = 2;
  // Name patterns (shell globs matched against a single path element) of files
  // and folders left out when walking a folder. They never apply to a path
  // listed in local_paths itself.
  repeated string skip_patterns = 3;
  // How many files of this upload are sent at the same time. Zero selects the
  // daemon's default.
  int32 parallel_files = 4;
}

message EnqueueUploadResponse {
  string upload_id = 1;
}

message WatchUploadsRequest {}

message WatchUploadFilesRequest {
  string upload_id = 1;
}

enum UploadState {
  UPLOAD_STATE_UNSPECIFIED = 0;
  QUEUED = 1;
  UPLOADING = 2;
  FINISHED = 3;
  FAILED = 4;
  // Not sending, with what was already sent kept: the user paused it, or
  // every upload is on hold. It goes back to QUEUED when that ends.
  PAUSED = 5;
  // The user stopped it for good. Like FAILED it can be retried.
  CANCELED = 6;
}

// Why an upload is PAUSED.
enum PauseReason {
  PAUSE_REASON_UNSPECIFIED = 0;
  // The user paused this upload.
  PAUSED_BY_USER = 1;
  // Every upload is on hold (SetOptionsRequest.hold_uploads).
  PAUSED_ON_HOLD = 2;
}

// What the user handed over as one upload.
enum UploadKind {
  UPLOAD_KIND_UNSPECIFIED = 0;
  // One file.
  SINGLE_FILE = 1;
  // One folder.
  FOLDER = 2;
  // Several files, folders or both.
  MULTIPLE = 3;
}

message UploadSnapshot {
  string upload_id = 1;
  // The file name, the folder name, or the name of the first item of several.
  string file_name = 2;
  // The first path the upload was enqueued with.
  string local_path = 3;
  // The object key of a single file; the key prefix (ending in "/") a folder
  // lands under; empty for several items and while nothing is resolved.
  string object_key = 4;
  // Sum over every file of the upload.
  int64 bytes_total = 5;
  int64 bytes_sent = 6;
  UploadState state = 7;
  string error_message = 8;
  UploadKind kind = 9;
  // Every path the upload was enqueued with, in order.
  repeated string root_paths = 10;
  int32 files_total = 11;
  int32 files_finished = 12;
  int32 files_failed = 13;
  // True on the last snapshot of an upload that left the history: removed by
  // the user, found missing from the bucket, or belonging to a bucket that is
  // no longer the configured one. Nothing follows it for this upload_id.
  bool removed = 14;
  // When the upload was enqueued, in milliseconds since the Unix epoch.
  int64 created_at_ms = 15;
  // When the upload finished or failed, in milliseconds since the Unix epoch.
  // Zero while it has not ended.
  int64 ended_at_ms = 16;
  // Set while state is PAUSED.
  PauseReason pause_reason = 17;
}

// One file of an upload.
message FileSnapshot {
  string upload_id = 1;
  // Position of the file inside its upload, stable for the upload's life.
  int32 index = 2;
  // Path shown to the user: the file name for a file handed over directly,
  // "<folder name>/<path inside it>" for a file found inside a folder.
  string relative_path = 3;
  string local_path = 4;
  string object_key = 5;
  int64 bytes_total = 6;
  int64 bytes_sent = 7;
  UploadState state = 8;
  string error_message = 9;
  // True on the last snapshot of a file that left its upload: removed by the
  // user or found missing from the bucket. Nothing follows it for this index.
  bool removed = 10;
}
